name: Auto Build Android APK dan PlayStore AAB
on: [push, workflow_dispatch]
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Sinkronisasi dan Build APK
        run: |
          npm install
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease
      - name: Download File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: DECO100-IDCard-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Download File AAB Siap Upload PlayStore
        uses: actions/upload-artifact@v4
        with:
          name: DECO100-IDCard-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/app-release.aab
